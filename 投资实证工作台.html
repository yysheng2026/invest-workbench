<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2C5BE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="投资实证">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="投资实证">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-512.png">
<title>投资实证 · 工作台</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --brand:#2C5BE6; --brand-2:#1E45B8; --brand-soft:#EDF2FF; --brand-line:#D6E1FF;
  --ink:#0E1B2E; --ink2:#4A5A70; --ink3:#93A1B5; --ink4:#B8C3D2;
  --bg:#F4F6FA; --card:#FFFFFF; --line:#E6EAF2; --line2:#D8E0EE;
  --up:#E13C3C; --up-soft:#FDECEC; --down:#12A05C; --down-soft:#E7F6EE; --flat:#93A1B5;
  --warn:#E8930C; --warn-soft:#FFF6E6;
  --r:14px; --r-s:9px;
  --sh:0 1px 2px rgba(16,32,64,.05), 0 4px 18px rgba(16,32,64,.045);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.6;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation}
body{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D3DBE8;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.side{width:196px;flex:0 0 196px;background:var(--card);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:30}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px;color:var(--ink)}
.brand p{margin:3px 0 0;font-size:12px;color:var(--ink3);letter-spacing:.3px}
.nav{padding:10px 10px;flex:1;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--r-s);
  color:var(--ink2);font-size:14.5px;margin-bottom:2px;transition:background .15s,color .15s;text-align:left}
.nav button:hover{background:#F3F6FC;color:var(--ink)}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--ink4);flex:0 0 6px}
.nav button.on .dot{background:var(--brand)}
.side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink4);line-height:1.5}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
.topbar .tt{font-size:17px;font-weight:600;letter-spacing:.2px}
.topbar .ts{font-size:12.5px;color:var(--ink3);margin-top:1px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tabs{display:none}
.wrap{padding:20px 24px 60px;max-width:1180px;width:100%;margin:0 auto;flex:1}

/* ---------- 组件 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px 20px;margin-bottom:16px}
.card.flat{box-shadow:none}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sub{font-size:12px;font-weight:400;color:var(--ink3)}
.card .desc{font-size:12.5px;color:var(--ink3);margin:0 0 14px;line-height:1.55}
.sec-title{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:1px;margin:0 0 10px;text-transform:uppercase}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric{background:var(--bg);border-radius:var(--r-s);padding:13px 14px}
.metric .lb{font-size:12px;color:var(--ink3);margin-bottom:3px}
.metric .vl{font-size:23px;font-weight:600;letter-spacing:-.3px;line-height:1.25}
.metric .ex{font-size:11.5px;color:var(--ink3);margin-top:2px}
.metric.big .vl{font-size:29px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r-s);
  background:var(--brand);color:#fff;font-size:14px;font-weight:500;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.gh{background:var(--card);color:var(--brand);border:1px solid var(--brand-line)}
.btn.gh:hover{background:var(--brand-soft)}
.btn.gy{background:var(--card);color:var(--ink2);border:1px solid var(--line2)}
.btn.gy:hover{background:#F3F6FC;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.dg{background:var(--card);color:var(--up);border:1px solid #F3C9C9}
.btn.dg:hover{background:var(--up-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}

input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--card);
  outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(44,91,230,.1)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
label.fl{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.frow{display:grid;gap:12px;margin-bottom:12px}
.f2{grid-template-columns:repeat(2,minmax(0,1fr))}
.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f4{grid-template-columns:repeat(4,minmax(0,1fr))}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--ink3);padding:9px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;letter-spacing:.3px}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFBFE}
.r{text-align:right}
.c{text-align:center}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.up{color:var(--up)} .down{color:var(--down)} .fl{color:var(--flat)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;background:var(--bg);
  color:var(--ink2);white-space:nowrap;margin:2px 4px 2px 0}
.tag.b{background:var(--brand-soft);color:var(--brand)}
.tag.g{background:var(--down-soft);color:var(--down)}
.tag.r{background:var(--up-soft);color:var(--up)}
.tag.y{background:var(--warn-soft);color:var(--warn)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.empty{text-align:center;padding:34px 16px;color:var(--ink3);font-size:13.5px}
.empty .ic{width:42px;height:42px;border-radius:50%;background:var(--bg);margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center}
.hr{height:1px;background:var(--line);margin:16px 0}
.rowbtw{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mut{color:var(--ink3);font-size:12.5px}
.ybar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin:0 auto 3px;max-width:56px;border:1px solid var(--line)}
.ybar i{display:block;height:100%;background:var(--brand)}
.ybar.lo i{background:var(--up)}.ybar.hi i{background:var(--down)}
.sm{font-size:12.5px}
.b{font-weight:600}
.nowrap{white-space:nowrap}
/* 行情状态提示条：与有知有行的克制风格一致，只用色块区分，不加图标噪音 */
.qthint{font-size:12.5px;line-height:1.6;padding:9px 12px;border-radius:9px;margin-bottom:12px}
.qthint.wait{background:var(--brand-soft);color:var(--brand)}
.qthint.bad{background:#FFF4F4;color:#A63A3A;border:1px solid #F6DCDC}
/* 卖出记录行 */
.trow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);
  border-top:1px solid var(--line);padding:9px 0}
.trow:first-of-type{border-top:none}
.trow>span{flex:1;min-width:0}
.trow b{font-weight:600;color:var(--ink)}
.trow .btn{padding:2px 8px;font-size:12px}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(14,27,46,.42);z-index:100;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(2px)}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(16,32,64,.22)}
.modal .mh{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);
  display:flex;align-items:center;justify-content:space-between;border-radius:16px 16px 0 0}
.modal .mh h3{margin:0;font-size:16px;font-weight:600}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:20px;line-height:1}
.x:hover{background:var(--bg);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:rgba(14,27,46,.93);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(16,32,64,.25);animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 图表 ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 12px}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd i{width:14px;height:2.5px;border-radius:2px;display:block}
.lgd i.d{height:0;border-top:2.5px dashed}

/* ---------- 特殊 ---------- */
.quote-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden}
.quote-card .nm{font-size:15px;font-weight:600;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.quote-card .cd{font-size:11.5px;color:var(--ink3);font-weight:400}
.quote-card .px{font-size:25px;font-weight:600;letter-spacing:-.4px;line-height:1.2}
.quote-card .chg{font-size:13.5px;font-weight:500}
.quote-card .kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2)}
.quote-card .kv b{font-weight:600;color:var(--ink)}
.quote-card .pnl{margin-top:2px;padding-top:9px;border-top:1px dashed var(--line)}
.thermo{height:14px;border-radius:14px;overflow:hidden;display:flex}
.thermo i{display:block;height:100%}
.log{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--r-s);
  padding:13px 15px;margin-bottom:11px}
.log .lh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.log .ld{font-size:12px;color:var(--ink3)}
.log .lt{font-size:14.5px;font-weight:600;flex:1;min-width:120px}
.log .lc{font-size:13.5px;color:var(--ink2);white-space:pre-wrap;line-height:1.65}
.rule{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:9px;background:var(--card);
  display:flex;gap:12px;align-items:flex-start}
.rule.off{opacity:.55}
.rule .rt{font-size:14px;font-weight:600;margin-bottom:2px}
.rule .rd{font-size:12.5px;color:var(--ink3);line-height:1.5}
.switch{width:40px;height:22px;border-radius:22px;background:var(--line2);position:relative;flex:0 0 40px;
  cursor:pointer;transition:background .18s;margin-top:2px}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:2.5px;left:2.5px;width:17px;height:17px;border-radius:50%;background:#fff;
  transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.switch.on i{transform:translateX(18px)}
.chk{width:19px;height:19px;border:1.5px solid var(--line2);border-radius:5px;flex:0 0 19px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px;background:var(--card)}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on:after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* ---------- 移动端 ---------- */
@media(max-width:900px){
  .side{display:none}
  .tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px;
    overflow-x:auto;position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:14px;color:var(--ink2);
    background:var(--bg);white-space:nowrap}
  .tabs button.on{background:var(--brand);color:#fff;font-weight:600}
  .topbar{padding:12px 14px}
  .topbar .tt{font-size:16px}
  .wrap{padding:14px 14px 40px}
  .card{padding:15px 14px;border-radius:12px;margin-bottom:12px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric .vl{font-size:21px}
  .metric.big .vl{font-size:25px}
  #toast{bottom:calc(20px + var(--sab))}
}
@media(max-width:420px){
  .g4,.g3,.g2,.f3,.f4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f2{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.hide{display:none!important}

/* ---------- 云同步提示条 ---------- */
.syncbar{background:var(--brand-soft);border-bottom:1px solid var(--brand-line);
  padding:9px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:13.5px;color:var(--brand-2)}
.syncbar .sp{flex:1}
.syncbar button{font-size:13px;padding:5px 12px;border-radius:7px;font-weight:500}
.syncbar .b1{background:var(--brand);color:#fff}
.syncbar .b2{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.syncbar.warn{background:var(--warn-soft);border-bottom-color:#F5DFA8;color:#8A5A06}
.syncbar.warn .b1{background:var(--warn);color:#fff}
.pairtxt{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
  line-height:1.5;word-break:break-all;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r-s);padding:9px 10px;margin-top:8px;color:var(--ink2)}
/* ---- 持仓 · 选股指标标签 ---- */
.quote-card .srltags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.quote-card .srltag{font-size:11px;padding:2px 7px;border-radius:10px;line-height:1.5;border:1px solid var(--line)}
.quote-card .srltag.hit{background:rgba(18,160,92,.10);color:#0f7a47;border-color:rgba(18,160,92,.30)}
.quote-card .srltag.miss{background:rgba(166,58,58,.08);color:#a63a3a;border-color:rgba(166,58,58,.22)}
.quote-card .srltag.na{background:var(--bg);color:var(--ink3);border-color:var(--line)}
.quote-card .srlcnt{font-size:11px;color:var(--ink3);align-self:center;margin-left:2px}
.sel{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;padding:0 6px;max-width:150px}
/* ---- 资产配置 ---- */
.seclab{font-size:13px;font-weight:600;color:var(--ink);margin:2px 0 8px;display:flex;align-items:center;gap:6px}
.seclab:before{content:"";width:3px;height:13px;background:var(--brand);border-radius:2px;display:inline-block}
.allocbar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0 4px}
.allocbar span{height:100%;display:block}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink2);cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.warnbox{margin-top:10px;background:var(--warn-soft);border:1px solid #F3D89A;color:#8a5a00;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.7}
.dtab{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.dtab th,.dtab td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line)}
.dtab th{color:var(--ink3);font-weight:600;font-size:12px}
.dtab .num{text-align:right;font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:18px;line-height:1.9;font-size:13.5px;color:var(--ink2)}
.tips li{margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>投资实证</h1>
      <p id="brandSub">记录 · 观察 · 应对</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <div id="syncBar" class="syncbar hide"></div>
    <header class="topbar">
      <div>
        <div class="tt" id="pgTitle">投资规划</div>
        <div class="ts" id="pgSub"></div>
      </div>
      <div class="acts"><span id="pgActs" style="display:contents"></span><button class="btn gy sm" id="btnSet">设置</button></div>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div id="toast"></div>
<div id="modalRoot"></div>
<script src="./stocks_data.js" onerror="window.__NO_STOCK_DATA__=1"></script>
<script src="./etf_data.js" onerror="window.__NO_ETF_DATA__=1"></script>
<script>
/* ==========================================================================
   投资实证工作台  ·  单文件版
   ========================================================================== */
"use strict";

/* ---------------- 常量 ---------------- */
var KEY = "invest_save_v1";
var VIEWS = [
  {id:"plan",     name:"投资规划", sub:"长期 · 当年 · 四笔钱"},
  {id:"account",  name:"账户资产", sub:"资金加权 vs 沪深300"},
  {id:"hold",     name:"持仓股票", sub:"实时看盘 · 买卖记录"},
  {id:"screen",   name:"选股",     sub:"规则库 · 监控池"},
  {id:"log",      name:"投资日志", sub:"当时怎么想的"},
  {id:"temp",     name:"市场温度", sub:"估值 · 股债性价比"},
  {id:"dividend", name:"股息日历", sub:"分红到账记录"},
  {id:"config",   name:"股票配置", sub:"个股 · 行业 · 核心卫星"},
  {id:"fund",     name:"选基",     sub:"ETF · 溢价 · 规模"}
];
var CUR = "plan";

/* ---------------- 工具 ---------------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function pad2(n){n=parseInt(n,10);return (n<10?"0":"")+n;}
function normDate(d){
  if(!d) return "";
  if(typeof d==="string"){var m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return m[1]+"-"+pad2(m[2])+"-"+pad2(m[3]); return d;}
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function todayStr(){return normDate(new Date());}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toNum(v,d){var n=parseFloat(v);return isFinite(n)?n:(d===undefined?0:d);}
function fmt(n,d){
  if(n==null||!isFinite(n)) return "—";
  d = d===undefined?2:d;
  return toNum(n).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtInt(n){ if(n==null||!isFinite(n)) return "—"; return Math.round(n).toLocaleString("zh-CN"); }
function money(n){
  if(n==null||!isFinite(n)) return "—";
  return "¥"+toNum(n).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function moneyShort(n){
  if(n==null||!isFinite(n)) return "—";
  var a=Math.abs(n);
  if(a>=1e8) return "¥"+fmt(n/1e8,2)+"亿";
  if(a>=1e4) return "¥"+fmt(n/1e4,2)+"万";
  return money(n);
}
function pct(n,d){ if(n==null||!isFinite(n)) return "—"; return (n>=0?"+":"")+fmt(n,d===undefined?2:d)+"%"; }
function cls(n){ return n>0?"up":(n<0?"down":"flat"); }
function daysBetween(a,b){
  var ta=new Date(a+"T00:00:00").getTime(), tb=new Date(b+"T00:00:00").getTime();
  if(!isFinite(ta)||!isFinite(tb)) return 0;   // 日期缺失时别让 NaN 污染整条计算链
  return Math.round((tb-ta)/86400000);
}
function dateAdd(ds,n){var d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return normDate(d);}
function toast(msg){
  var box=$("#toast"); if(!box) return;
  var el=document.createElement("div"); el.className="tst"; el.textContent=msg; box.appendChild(el);
  setTimeout(function(){el.style.transition="opacity .3s";el.style.opacity="0";
    setTimeout(function(){el.remove();},320);},2000);
}

var DESKTOP={ok:false,checked:false,pending:null};
function desktopProbe(cb){
  if(DESKTOP.checked){ cb&&cb(DESKTOP.ok); return; }
  if(location.protocol==="file:"){ DESKTOP.checked=true; cb&&cb(false); return; }
  fetch("/api/ping",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
    DESKTOP.ok=!!(j&&j.ok); DESKTOP.checked=true; cb&&cb(DESKTOP.ok);
  }).catch(function(){ DESKTOP.checked=true; cb&&cb(false); });
}

  ["plan","account","tempCfg","settings"].forEach(function(k){ if(!S[k]) S[k]=d[k]; });
  ["holdings","trades","rules","watch","logs","dividends","flows"].forEach(function(k){ if(!Array.isArray(S[k])) S[k]=d[k]||[]; });
  if(!S.mcost||typeof S.mcost!=="object") S.mcost={};

/* ---------------- 收益算法 ---------------- */
/* XIRR：资金加权收益率（牛顿迭代） */
function xirr(flows,endValue,endDate){
  var cf=[],i;
  if(!flows.length) return null;
  var t0=new Date(flows[0].date+"T00:00:00").getTime();
  for(i=0;i<flows.length;i++){
    var td=(new Date(flows[i].date+"T00:00:00").getTime()-t0)/86400000;
    cf.push({t:td/365, v:-toNum(flows[i].amount)});   // 转入=投入=现金流出(负)
  }
  var te=(new Date(endDate+"T00:00:00").getTime()-t0)/86400000;
  cf.push({t:te/365, v:toNum(endValue)});
  if(te<=0) return null;
  var r=0.12;
  for(i=0;i<200;i++){
    var f=0,df=0,k;
    for(k=0;k<cf.length;k++){
      var e=Math.pow(1+r,-cf[k].t);
      f+=cf[k].v*e;
      df+=cf[k].v*(-cf[k].t)*Math.pow(1+r,-cf[k].t-1);
    }
    if(Math.abs(df)<1e-12) break;
    var nr=r-f/df;
    if(!isFinite(nr)) break;
    if(nr<=-0.9999) nr=-0.9999;
    if(nr>10) nr=10;
    if(Math.abs(nr-r)<1e-9){r=nr;break;}
    r=nr;
  }
  return r;
}
/* TWR：时间加权收益率（剔除资金进出影响） */
function twr(snaps,flows){
  if(snaps.length<2) return null;
  var acc=1;
  for(var i=1;i<snaps.length;i++){
    var v0=toNum(snaps[i-1].total), v1=toNum(snaps[i].total);
    if(v0<=0) continue;
    /* 关键：归属「两次快照之间」的全部现金流，而不是只匹配当天。
       只匹配当天会漏掉绝大多数转入，把本金当成收益，TWR 会严重失真。
       左开右闭：恰好发生在上一快照当日的资金，已包含在 v0 里，不再重复扣。 */
    var cf=0;
    for(var j=0;j<flows.length;j++){
      var fd=flows[j].date;
      if(fd>snaps[i-1].date && fd<=snaps[i].date)
        cf+=toNum(flows[j].amount)*(flows[j].type==="out"?-1:1);
    }
    var r=(v1-cf-v0)/v0;
    if(r<=-1) r=-0.99;
    acc*=(1+r);
  }
  return acc-1;
}
/* 累计净投入 */
function netInvested(){
  var n=0;
  S.account.flows.forEach(function(f){ n += (f.type==="out" ? -toNum(f.amount) : toNum(f.amount)); });
  return n;
}
/* 当前总资产 = 持仓实时市值 + 现金 + 其他资产 */
function holdingsMV(){
  var mv=0;
  S.holdings.forEach(function(h){
    var q=QUOTE[h.code];
    var p=q?toNum(q.price):toNum(h.cost);
    mv += p*toNum(h.shares);
  });
  return mv;
}
function totalAsset(){
  return holdingsMV() + toNum(S.account.cash) + toNum(S.account.other);
}
/* 今天快照写入/更新 */
function upsertSnap(){
  if(!S.settings.autoSnap) return;
  var t=todayStr(), v=totalAsset();
  if(v<=0) return;
  var last=S.account.snaps[S.account.snaps.length-1];
  if(last && last.date===t){ last.total=Math.round(v*100)/100; }
  else S.account.snaps.push({date:t,total:Math.round(v*100)/100});
  save();
}
/* 综合收益指标 */
function metrics(){
  var flows=S.account.flows.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var invested=netInvested();
  var total=totalAsset();
  var profit=total-invested;
  var start=(flows.length&&flows[0].date)?flows[0].date:(S.account.startDate||todayStr());
  var days=Math.max(1,daysBetween(start,todayStr()));
  var xr=xirr(flows,total,todayStr());
  /* ⚠️ XIRR 本身就是「年化」口径——xirr() 里折现指数用的是 t/365，解出来的 r 已是年利率。
     这里绝不能再按天数折算一次，否则会二次年化：
     实测 105 天亏 24.62% 时，正确年化 −62.56%，二次年化会错成 −96.71%。
     所以 annual 直接取 xr；真正的「区间收益率」是 simple（累计收益÷净投入）。*/
  var annual=xr;
  var tw=twr(S.account.snaps,flows);
  var simple=invested>0?profit/invested*100:null;
  return {invested:invested,total:total,profit:profit,days:days,start:start,
    xirr:xr!=null?xr*100:null, annual:annual!=null?annual*100:null, twr:tw!=null?tw*100:null, simple:simple};
}

/* ---------------- 行情（腾讯 JSONP） ---------------- */
var QUOTE = {};        // code -> {name,price,prev,chg,chgPct,pe,pb,mc,open,high,low,time}
var HS300 = null;
/* 行情链路状态。腾讯接口返回 text/html，靠「无 nosniff」才能被 <script> 执行，
   属于可能失效的链路，所以必须可观测、可降级，不能让用户对着一堆「—」发呆。*/
var QT = {ok:0,fail:0,msg:"",pending:0};
/* 中证/上证系列指数走 sh。这些代码以 00 开头，但归属上交所，
   若按个股规则会被误判成 sz 而取不到数据（沪深300 就踩过这个坑）。 */
var IDX_SH={"000300":1,"000016":1,"000905":1,"000852":1,"000688":1,
            "000015":1,"000010":1,"000009":1,"000903":1,"000922":1};
function tcode(code){
  code=String(code).trim().toLowerCase();
  if(/^(sh|sz|bj)\d{6}$/.test(code)) return code;   // 已带市场前缀，直接透传
  var c6=code.replace(/\D/g,"");
  while(c6.length<6) c6="0"+c6;                      // 容错：用户可能只输 300
  c6=c6.slice(-6);
  if(IDX_SH[c6]) return "sh"+c6;
  if(/^(60|68|51|58|11|50)/.test(c6)) return "sh"+c6;
  if(/^(00|30|12|15|16|18)/.test(c6)) return "sz"+c6;
  if(/^(8|4|92)/.test(c6)) return "bj"+c6;
  return "sh"+c6;
}
/* 解析 `v_sh600519="1~贵州茅台~...";` 形式的响应文本，写入 QUOTE。
   fetch 通道拿到的是文本、JSONP 通道拿到的是全局变量，两者最终都走这里。*/
function qtIngest(text){
  var got=0, re=/v_([a-z]{2}\d{6})="([^"]*)"/gi, m;
  while((m=re.exec(text))){
    var f=m[2].split("~");
    if(f.length<46) continue;
    var full=m[1], code=full.slice(2);
    QUOTE[code]={name:f[1],code:code,
      price:toNum(f[3]),prev:toNum(f[4]),open:toNum(f[5]),
      chg:toNum(f[31]),chgPct:toNum(f[32]),high:toNum(f[33]),low:toNum(f[34]),
      vol:toNum(f[36]),amount:toNum(f[37]),turnover:toNum(f[38]),
      pe:toNum(f[39]),pb:toNum(f[46]),mc:toNum(f[45]),fc:toNum(f[44]),
      limitUp:toNum(f[47]),limitDown:toNum(f[48]),vr:toNum(f[49]),
      time:f[30]};
    if(full==="sh000300"&&f.length>4)
      HS300={price:toNum(f[3]),chgPct:toNum(f[32]),name:"沪深300"};
    got++;
  }
  return got;
}
function fetchQuotes(codes,cb){
  codes = codes.filter(function(c){return c;}).map(function(c){return String(c).trim();});
  if(!codes.length){ cb&&cb(); return; }
  var batch=codes.slice(0,80);
  var url="https://qt.gtimg.cn/q="+batch.map(tcode).join(",");
  var done=false, timer=null;
  function finish(ok,msg){
    if(done) return; done=true;
    if(timer) clearTimeout(timer);
    if(QT.pending>0) QT.pending--;
    if(ok){ QT.ok=Date.now(); QT.msg=""; }
    else { QT.fail=Date.now(); QT.msg=msg||"行情获取失败"; }
    cb&&cb();
  }
  QT.pending++;

  /* 通道 1：fetch。腾讯带 Access-Control-Allow-Origin:*，可直接读；
     广告拦截插件主要拦「第三方 <script>」，对 fetch 的误拦率低得多，
     所以这条通道明显比 JSONP 稳。*/
  function tryFetch(){
    if(typeof fetch!=="function"){ tryJsonp(); return; }
    var to=setTimeout(function(){ if(!done) tryJsonp(); },6000);
    fetch(url,{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.arrayBuffer();
    }).then(function(buf){
      if(done) return;
      clearTimeout(to);
      /* 接口是 GBK，浏览器默认按 UTF-8 解会把中文变乱码。
         优先按 GBK 解码；环境不支持时退回 UTF-8（只影响名称，价格不受影响）。*/
      var text;
      try{ text=new TextDecoder("gbk").decode(buf); }
      catch(e){ text=new TextDecoder("utf-8").decode(buf); }
      finish(qtIngest(text)>0, "接口未返回行情数据");
    }).catch(function(){ if(!done){ clearTimeout(to); tryJsonp(); } });
  }

  /* 通道 2：JSONP 兜底（fetch 被拦或不可用时） */
  function tryJsonp(){
    if(done) return;
    var s=document.createElement("script");
    s.charset="gbk";
    s.onload=function(){
      if(done) return;
      var got=0;
      batch.forEach(function(code){
        var g=window["v_"+tcode(code)];
        if(!g) return;
        var f=String(g).split("~");
        if(f.length<46) return;
        QUOTE[code]={name:f[1],code:code,
          price:toNum(f[3]),prev:toNum(f[4]),open:toNum(f[5]),
          chg:toNum(f[31]),chgPct:toNum(f[32]),high:toNum(f[33]),low:toNum(f[34]),
          vol:toNum(f[36]),amount:toNum(f[37]),turnover:toNum(f[38]),
          pe:toNum(f[39]),pb:toNum(f[46]),mc:toNum(f[45]),fc:toNum(f[44]),
          limitUp:toNum(f[47]),limitDown:toNum(f[48]),vr:toNum(f[49]),
          time:f[30]};
        got++;
      });
      if(HS300==null&&window.v_sh000300){
        var f=String(window.v_sh000300).split("~");
        if(f.length>4){ HS300={price:toNum(f[3]),chgPct:toNum(f[32]),name:"沪深300"}; }
      }
      try{ if(s.parentNode) s.parentNode.removeChild(s); }catch(e){}
      finish(got>0, got>0?"":"接口未返回行情数据");
    };
    s.onerror=function(){
      try{ if(s.parentNode) s.parentNode.removeChild(s); }catch(e){}
      finish(false,"网络错误或请求被拦截");
    };
    s.src=url+"&_="+Date.now();
    document.head.appendChild(s);
  }

  /* 总超时兜底：两条通道都没反应时也必须回调，否则页面永远停在「加载中」 */
  timer=setTimeout(function(){ finish(false,"请求超时（12 秒）"); },12000);
  tryFetch();
}

/* ---------------- 主力成本（累积估算）+ 近一年价格分位 ----------------
   主力成本：真·机构持仓成本是拿不到的（交易所不公开）。这里用「主力资金净流入」
   逐日加权累加来估算：每天记一次「当日主力净流入金额」和「当日均价」，
   cost = Σ金额 ÷ Σ(金额÷价格)，等价于主力净买入的成交量加权平均价。
   局限必须清楚：① 只有「净额」，主力当天又买又卖的部分互相抵消，看不到；
   ② 是滞后数据，主力自己也会看错、也会割肉；③ 需要连续积累才有统计意义。
   ------------------------------------------------------------------- */
var MC_MIN_DAYS = 5;      /* 少于这么多天不给值（噪音太大） */
var MC_FULL_DAYS = 20;    /* 达到这么多天认为是稳定值 */
var YEARPOS = {};         /* code -> {hi,lo,pos} 近一年最高/最低/现价分位 */
var EXTRA_AUTO = 0;       /* 进入页面时自动补抓一次，避免一屏"—" */

function emSecid(code){
  var c = String(code || "").trim();
  if(!/^\d{6}$/.test(c)) return "";
  if(/^(6|9|5)/.test(c)) return "1." + c;   /* 沪市股票 / 沪B / 沪ETF */
  if(/^11/.test(c))      return "1." + c;   /* 沪可转债 */
  return "0." + c;                          /* 深市、北交所 */
}
function mcAmtOK(amtSum){ return Math.abs(toNum(amtSum)) >= 10000; }  /* 净额太小=噪音 */

function mainCostOf(code){
  if(!S.mcost) return null;
  var m = S.mcost[code];
  if(!m || !m.qtySum) return null;
  var amt = toNum(m.amtSum), q = toNum(m.qtySum);
  if(!q || !isFinite(amt / q)) return null;
  var cost = amt / q;
  if(!isFinite(cost) || cost <= 0) return null;
  if(!mcAmtOK(amt)) return null;
  return { cost: cost, n: toNum(m.n) || 0, net: amt, ready: (toNum(m.n) || 0) >= MC_MIN_DAYS };
}
/* 记一笔。同一天重复刷新时先把上次那笔回滚，再按最新值重记，避免重复累加 */
function recordMainCost(code, day, amt, px){
  if(!/^\d{6}$/.test(String(code || "")) || !day || !(px > 0)) return false;
  if(!S.mcost) S.mcost = {};
  var m = S.mcost[code] || { n:0, amtSum:0, qtySum:0, lastDate:"", lastAmt:0, lastQty:0 };
  if(m.lastDate === day){
    m.amtSum -= toNum(m.lastAmt);
    m.qtySum -= toNum(m.lastQty);
  }else{
    m.n = (toNum(m.n) || 0) + 1;
  }
  var q = amt / px;
  m.amtSum = toNum(m.amtSum) + amt;
  m.qtySum = toNum(m.qtySum) + q;
  m.lastDate = day; m.lastAmt = amt; m.lastQty = q;
  S.mcost[code] = m;
  return true;
}
/* 东财「当日主力净流入 + 当日收盘价」。主站 push2his 常被限流，
   push2delay 这个节点实测稳定且带 CORS，但只提供当日数据（历史拿不到）。*/
function fetchMainCost(codes, cb){
  codes = (codes || []).filter(function(c){ return emSecid(c); });
  if(!codes.length){ cb && cb(0); return; }
  var F = "&fields1=f1,f2,f3,f7&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64,f65";
  var got = 0, pending = codes.length;
  if(!pending){ cb && cb(0); return; }
  function fin(){ if(--pending <= 0) cb && cb(got); }
  codes.forEach(function(code){
    var url = "https://push2delay.eastmoney.com/api/qt/stock/fflow/daykline/get?secid=" +
              encodeURIComponent(emSecid(code)) + "&lmt=1&klt=101" + F;
    if(typeof fetch !== "function"){ fin(); return; }
    var to = setTimeout(fin, 9000);
    fetch(url, { cache: "no-store" }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(d){
      var ks = (d && d.data && d.data.klines) || [];
      if(ks.length){
        var f = String(ks[0]).split(",");
        /* 字段：0日期 1主力净流入 2小单 3中单 4大单 5超大单 ... 11当日收盘价 */
        if(recordMainCost(code, f[0], toNum(f[1]), toNum(f[11]))) got++;
      }
      clearTimeout(to); fin();
    }).catch(function(){ clearTimeout(to); fin(); });
  });
}
/* 近一年（250 交易日）价格分位：腾讯日 K，稳定可用 */
function fetchYearPos(codes, cb){
  codes = (codes || []).filter(function(c){ return /^\d{6}$/.test(String(c || "")); });
  if(!codes.length){ cb && cb(); return; }
  var pending = codes.length;
  function fin(){ if(--pending <= 0) cb && cb(); }
  codes.forEach(function(code){
    var tk = tcode(code);
    var node0 = "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=" + tk + ",day,,,250,qfq";
    if(typeof fetch !== "function"){ fin(); return; }
    var to = setTimeout(fin, 9000);
    fetch(node0, { cache: "no-store" }).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(d){
      var node = (d && d.data && d.data[tk]) || {};
      var k = node.qfqday || node.day || [];
      if(k.length){
        var hi = -Infinity, lo = Infinity, i;
        for(i = 0; i < k.length; i++){
          var h = toNum(k[i][3]), l = toNum(k[i][4]);
          if(h > hi) hi = h;
          if(l > 0 && l < lo) lo = l;
        }
        if(hi > 0 && lo > 0 && hi > lo){
          var q = QUOTE[code];
          var px = q && toNum(q.price) > 0 ? toNum(q.price) : toNum(k[k.length - 1][2]);
          YEARPOS[code] = { hi: hi, lo: lo, px: px,
            pos: Math.max(0, Math.min(100, (px - lo) / (hi - lo) * 100)) };
        }
      }
      clearTimeout(to); fin();
    }).catch(function(){ clearTimeout(to); fin(); });
  });
}
function refreshExtras(codes, cb){

/* ---------------- SVG 折线图 ---------------- */
function lineChart(series,opts){
  opts=opts||{};
  var W=opts.w||900, H=opts.h||280, PL=52,PR=14,PT=16,PB=28;
  if(!series||!series.length) return '<div class="empty">暂无数据</div>';
  var n=0,min=0,max=0,i,j;
  for(i=0;i<series.length;i++){
    var pts=series[i].data; if(!pts.length) continue;
    n=Math.max(n,pts.length);
    for(j=0;j<pts.length;j++){
      var v=pts[j].y; if(!isFinite(v)) continue;
      if(i===0&&j===0){min=v;max=v;}
      if(v<min)min=v; if(v>max)max=v;
    }
  }
  if(n<2) return '<div class="empty">至少需要 2 个数据点才能画曲线</div>';
  if(min===max){min=min-1;max=max+1;}
  var pad=(max-min)*0.12; min-=pad; max+=pad;
  var iw=W-PL-PR, ih=H-PT-PB;
  function X(k){ return PL + (n<=1?0:iw*k/(n-1)); }
  function Y(v){ return PT + ih - (v-min)*ih/(max-min); }
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="收益率走势图">';
  // 零轴
  if(min<0&&max>0){
    s+='<line x1="'+PL+'" y1="'+Y(0)+'" x2="'+(W-PR)+'" y2="'+Y(0)+'" stroke="#D8E0EE" stroke-width="1" stroke-dasharray="3 3"/>';
    s+='<text x="'+(PL-8)+'" y="'+(Y(0)+4)+'" font-size="11" fill="#93A1B5" text-anchor="end">0%</text>';
  }
  // Y 轴刻度
  var steps=4;
  for(i=0;i<=steps;i++){
    var v=min+(max-min)*i/steps, y=Y(v);
    s+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="#EEF1F7" stroke-width="1"/>';
    s+='<text x="'+(PL-8)+'" y="'+(y+4)+'" font-size="11" fill="#93A1B5" text-anchor="end">'+fmt(v,0)+'%</text>';
  }
  // X 轴标签
  var labels=series[0].labels||[];
  var every=Math.max(1,Math.ceil(n/6));
  for(i=0;i<n;i+=every){
    if(!labels[i])continue;
    s+='<text x="'+X(i)+'" y="'+(H-8)+'" font-size="11" fill="#93A1B5" text-anchor="middle">'+esc(labels[i])+'</text>';
  }
  // 线
  for(i=0;i<series.length;i++){
    var sp=series[i], d="";
    for(j=0;j<sp.data.length;j++){
      if(!isFinite(sp.data[j].y)) continue;
      d+=(d?"L":"M")+fmt(X(j),1)+" "+fmt(Y(sp.data[j].y),1);
    }
    if(!d) continue;
    s+='<path d="'+d+'" fill="none" stroke="'+sp.color+'" stroke-width="'+(sp.width||2)+
       '" stroke-linejoin="round" stroke-linecap="round"'+(sp.dash?' stroke-dasharray="5 4"':'')+'/>';
    var lastP=sp.data[sp.data.length-1];
    if(lastP&&isFinite(lastP.y)){
      s+='<circle cx="'+fmt(X(sp.data.length-1),1)+'" cy="'+fmt(Y(lastP.y),1)+'" r="3.2" fill="'+sp.color+'"/>';
    }
  }
  s+='</svg>';
  return s;
}

function benchAt(list,d){
  if(!list||!list.length) return null;
  if(d<list[0][0]||d>list[list.length-1][0]) return null;
  var lo=0,hi=list.length-1,r=null;
  while(lo<=hi){ var mid=(lo+hi)>>1; if(list[mid][0]<=d){ r=list[mid][1]; lo=mid+1; } else hi=mid-1; }
  return r;
}
function seriesData(){
  var snaps=S.account.snaps.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(!snaps.length) return null;
  var flows=S.account.flows.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var start=flows.length?flows[0].date:(snaps[0].date);
  var tgt=toNum(S.plan.longTerm.targetAnnual);
  var SD=(window.__STOCKS_DATA__||{});
  var bench=SD.bench||[], b0=null;
  var out={me:[],exp:[],bm:[],labels:[],days:[]};
  for(var i=0;i<snaps.length;i++){
    var d=snaps[i].date, v=toNum(snaps[i].total);
    var f2=flows.filter(function(f){return f.date<=d;});
    var xr=(f2.length>0)?xirr(f2,v,d):null;
    out.me.push({y: xr!=null? xr*100 : null});
    var dd=daysBetween(start,d);
    out.days.push(dd);
    out.exp.push({y:(Math.pow(1+tgt/100,dd/365)-1)*100});
    var bv=benchAt(bench,d);
    if(bv!=null){ if(b0==null) b0=bv; out.bm.push({y:(bv/b0-1)*100}); } else out.bm.push({y:null});
    out.labels.push(d.slice(2,10));
  }
  return out;
}

/* 已实现盈亏：只统计填了成本价的卖出。成本留空的补录交易不计盈亏（避免虚构数字），
   但现金流和日志照常记录，交易记录里会标「成本未填」。 */
function realizedPnl(){
  var s=0;
  (S.trades||[]).forEach(function(t){
    if(t.cost==null||!isFinite(t.cost)) return;
    /* 已实现盈亏扣掉卖出手续费 + 红利税补扣，才是真正落袋的 */
    s+=(toNum(t.sellPrice)-toNum(t.cost))*toNum(t.shares) - toNum(t.fee) - toNum(t.divTax);
  });
  return s;
}
function holdingStats(h){
  var q=QUOTE[h.code];
  var price=q?toNum(q.price):toNum(h.cost);
  var shares=toNum(h.shares), cost=toNum(h.cost);
  var mv=price*shares, cst=cost*shares, pnl=mv-cst;
  var pnlPct=cst>0?pnl/cst*100:null;
  var dayPnl=q?toNum(q.chg)*shares:null;
  return {price:price,mv:mv,cst:cst,pnl:pnl,pnlPct:pnlPct,dayPnl:dayPnl,q:q};
}
function totalFees(){
  /* 手续费 = 买入侧（佣金/过户费等）+ 卖出侧（佣金/印花税等），买卖都会产生 */
  var b=0;
  (S.holdings||[]).forEach(function(h){ b+=toNum(h.fee); });
  (S.trades||[]).forEach(function(t){ b+=toNum(t.fee); });
  return b;
}
function totalDivTax(){
  /* 红利税补扣只在卖出时发生（持仓不足 1 年卖出、券商补扣股息税差额） */
  var d=0;
  (S.trades||[]).forEach(function(t){ d+=toNum(t.divTax); });
  return d;
}

        (fex?"。"+fex:"")+"。"+snapNote,

    toast(realized==null?"已补录卖出（未计盈亏）":("已记录卖出，盈亏 "+(realized>=0?"+":"")+money(realized)));
  };
}

/* ================= 批量导入持仓（同花顺 / 券商导出） ================= */
function splitCells(line){
  /* ⚠️ 不要先 trim 整行再切分：券商导出的数据行首列（如「操作」）经常是空的，
     开头的制表符被 trim 掉后所有列会整体左移一位，列映射全错（实测踩过）。
     只去掉行尾的 \r，保留列分隔结构，最后再逐个 trim 单元格。*/
  var s=String(line).replace(/\r$/,"");
  if(s.indexOf("\t")>=0) return s.split("\t").map(function(x){return x.trim();});
  var t=s.trim();
  if(t.indexOf("|")>=0)  return t.split("|").map(function(x){return x.trim();});
  if(t.indexOf(",")>=0)  return t.split(",").map(function(x){return x.trim();});
  if(t.indexOf("，")>=0) return t.split("，").map(function(x){return x.trim();});
  return t.split(/\s{2,}|\s+/).map(function(x){return x.trim();});
}
function numOrNull(v){
  if(v==null) return null;
  var s=String(v).replace(/[,，\s¥%元]/g,"");
  if(!s) return null;
  var n=parseFloat(s);
  return isFinite(n)?n:null;
}
function parseHoldingsText(text){
  /* ⚠️ 只去掉行尾 \r，绝不能用 s.trim()：
     券商导出的数据行首列（如「操作」列）是空的，行以 \t 开头。
     一旦 trim 掉行首的制表符，整行所有列会左移一位——
     表头首列有字不受影响，数据行受影响，于是「证券名称」位置变成了数量。
     这是本次接入同花顺真实导出文件时踩到的坑。*/
  var lines=String(text).split(/\r?\n/).map(function(s){return s.replace(/\r$/,"");})
            .filter(function(s){ return s.trim() && !/^[-=+]+$/.test(s.trim()); });
  var out={rows:[],warn:[],hasHeader:false,cols:null,shift:0};
  if(!lines.length) return out;
  var isHead=/代码|名称|数量|股数|成本|市值|盈亏|证券|持仓|份额/.test(lines[0]);
  var idx={code:-1,name:-1,shares:-1,cost:-1,price:-1};
  var start=0;
  if(isHead){
    out.hasHeader=true; start=1;
    /* 列名匹配必须精确到优先级，不能有歧义：
       同花顺表头同时有「股票余额」和「可用余额」，两者都含"余额"，
       笼统匹配会先撞上「可用余额」，把可用数量当成持仓数量（实测踩过）。
       所以按完整列名精确匹配，并显式排除"可用/冻结/可用股份"。*/
    /* 用「按优先级排序的备选列名」逐级匹配，先精确后宽松。
       同花顺表头同时含「股票余额」和「可用余额」，笼统的 /余额/ 会先撞上可用数量；
       所以每个字段都要有明确的优先级，且同级里禁止出现会误伤的宽泛词。*/
    var cols=splitCells(lines[0]);
    function pick(list){
      for(var a=0;a<list.length;a++)
        for(var k=0;k<cols.length;k++)
          if(String(cols[k]||"").replace(/\s/g,"").indexOf(list[a])>=0) return k;
      return -1;
    }
    idx.code  = pick(["证券代码","股票代码","证券编码","代码","code"]);
    idx.name  = pick(["证券名称","股票名称","证券简称","股票简称","名称","简称","name"]);
    /* 数量：「股票余额」必须排在「余额」前面，并显式跳过可用/冻结类的列 */
    idx.shares= pick(["股票余额","持仓数量","证券数量","当前持仓","持股数量","股数","数量","持仓","份额"]);
    if(idx.shares>=0 && /可用|冻结|可卖|可转/.test(String(cols[idx.shares]||""))){
      var alt=-1;
      for(var k2=0;k2<cols.length;k2++){
        var c2=String(cols[k2]||"");
        if(/可用|冻结|可卖|可转/.test(c2)) continue;
        if(/股票余额|持仓数量|证券数量|当前持仓|持股数量|股数|数量/.test(c2)){ alt=k2; break; }
      }
      idx.shares=alt;
    }
    idx.cost  = pick(["摊薄成本","持仓成本","成本价","买入均价","成本"]);
    idx.price = pick(["最新价","当前价","市价","现价"]);
    out.cols=cols.map(function(c,i){
      return c+"→"+(i===idx.code?"代码":i===idx.name?"名称":i===idx.shares?"数量":
        i===idx.cost?"成本":i===idx.price?"现价":"");
    });
  }
  /* 列数对齐：券商导出常出现「表头 19 列、数据 18 列」——表头首列「操作」有字，
     数据行该列为空，切分后整个数据行左移一位，按下标取值会全部错位。
     这里用第一行数据探测偏移量，之后所有行统一补偿。*/
  var sh=0;
  if(isHead){
    for(var q=start;q<lines.length;q++){
      var probe=splitCells(lines[q]);
      if(!probe.length) continue;
      if(probe.length<cols.length&&!String(probe[0]||"").length) sh=cols.length-probe.length;
      break;
    }
  }
  out.shift=sh;
  for(var i=start;i<lines.length;i++){
    var cs=splitCells(lines[i]), code=null, j, m;
    if(sh>0&&!String(cs[0]||"").length) cs=cs.slice(sh);
    if(idx.code>=0&&cs[idx.code]){ m=String(cs[idx.code]).match(/\d{6}/); if(m) code=m[0]; }
    if(!code){ for(j=0;j<cs.length;j++){ if(/^\d{6}$/.test(String(cs[j]))){ code=String(cs[j]); break; } } }
    if(!code){ out.warn.push("第 "+(i+1)+" 行没找到 6 位代码"); continue; }
    var name=(idx.name>=0?String(cs[idx.name]||"").trim():"");
    var shares=numOrNull(cs[idx.shares]), cost=numOrNull(cs[idx.cost]), price=numOrNull(cs[idx.price]);
    if(!isHead||idx.shares<0){                      // 无表头：按 代码 名称 数量 成本价 [现价] 兜底
      var nums=[];
      for(j=0;j<cs.length;j++){
        if(/^\d{6}$/.test(String(cs[j]))) continue;   // 代码本身也是 6 位数字，必须排除，否则会被当成数量
        var v=numOrNull(cs[j]); if(v!=null) nums.push(v);
      }
      if(!name){ for(j=0;j<cs.length;j++){ if(!/^\d{6}$/.test(String(cs[j]))&&numOrNull(cs[j])==null){ name=String(cs[j]); break; } } }
      if(shares==null) shares=nums[0];
      if(cost==null)   cost=nums[1];
      if(price==null)  price=nums[2];
    }
    if(shares==null||shares<=0){ out.warn.push(code+" 数量缺失"); continue; }
    out.rows.push({code:code,name:name||code,shares:shares,cost:cost,price:price});
  }
  return out;
}

    '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<button class="btn gh sm" id="_impParse">解析预览</button>'+
      '<span class="mut sm" id="_impMsg"></span></div>'+
    '<div id="_impPrev" style="margin-top:12px;max-height:280px;overflow:auto"></div>'+
    '<div id="_impOpt" style="margin-top:12px;display:none;border-top:1px solid var(--line);padding-top:12px">'+
      '<div id="_impDup"></div>'+
      '<label class="fl">与账户里已有的持仓重复时</label>'+
      '<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;margin:4px 0 12px">'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">'+

        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">'+
          '<input type="radio" name="_impmode" id="_impModeAdd" style="width:16px;height:16px"> '+
          '累加到已有持仓上</label>'+
      '</div>'+
      '<label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer">'+
      '<input type="checkbox" id="_impFlow" checked style="width:17px;height:17px"> '+
      '同时补记一笔转入（否则「投入本金」为 0，XIRR 算不出来）</label>'+
      '<div class="frow f2" style="margin-top:8px">'+
        '<div><label class="fl">补记转入金额 ¥</label><input type="number" step="0.01" id="_impAmt"></div>'+
        '<div><label class="fl">转入日期</label><input type="date" id="_impDate" value="'+todayStr()+'"></div></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
        '<button type="button" class="btn gh sm" id="_impP1"></button>'+
        '<button type="button" class="btn gh sm" id="_impP2"></button></div>'+

    '</div>',
    '<button class="btn gy" data-close>取消</button><button class="btn" id="_impOk" disabled>导入选中</button>');

  /* 直接选文件：同花顺导出的 .xls 是 GBK 文本，先按 GBK 解，出现替换字符再改用 UTF-8 */
  var _impFile=$("#_impFile");
  if(_impFile) _impFile.onchange=function(){
    var f=_impFile.files&&_impFile.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var buf=fr.result, txt="";
      try{ txt=new TextDecoder("gbk").decode(buf); }catch(e){ txt=""; }
      if(!txt||txt.indexOf("\ufffd")>=0){
        try{ txt=new TextDecoder("utf-8").decode(buf); }catch(e2){ txt=""; }
      }
      if(!txt){ try{ txt=new TextDecoder("utf-8").decode(buf); }catch(e3){ txt=String(fr.result||""); } }
      var ta=$("#_impTxt"); if(ta) ta.value=txt.replace(/^\ufeff/,"");
      var p=$("#_impParse"); if(p) p.click();
    };
    fr.onerror=function(){ var m=$("#_impMsg"); if(m) m.textContent="文件读取失败，请改用粘贴方式。"; };
    fr.readAsArrayBuffer(f);
  };

  function selected(){
    var sel=[];
    $$("#_impPrev .impck").forEach(function(el){ if(el.checked) sel.push(parseInt(el.getAttribute("data-i"),10)); });
    return sel;
  }
  function impMode(){ var el=$("#_impModeOv"); return (el&&el.checked)?"over":"add"; }

  /* 模拟「导入之后」的最终持仓。⚠️ 必须按最终状态算成本，不能用勾选行的成本直接相加：
     若账户里已有同一支股票，覆盖模式下它的成本会被本次导入替换掉。 */
  function finalHoldings(){
    var sel=selected(), mode=impMode(), map={}, order=[];
    (S.holdings||[]).forEach(function(h){
      map[h.code]={code:h.code,name:h.name,cost:toNum(h.cost),shares:toNum(h.shares)};
      order.push(h.code);
    });
    sel.forEach(function(i){
      var r=parsed.rows[i]; if(!r) return;
      var ex=map[r.code];
      if(ex){
        if(mode==="add"){ ex.shares+=r.shares; if(r.cost!=null&&ex.cost<=0) ex.cost=r.cost; }
        else { ex.shares=r.shares; if(r.cost!=null) ex.cost=r.cost; }
      }else{
        map[r.code]={code:r.code,name:r.name,cost:(r.cost==null?0:r.cost),shares:r.shares};
        order.push(r.code);
      }
    });
    return order.map(function(c){ return map[c]; });
  }

  /* 已有持仓里与本次导入冲突的代码（覆盖模式下会被改写的那些） */
  function dupCodes(sel){
    var have={}; (S.holdings||[]).forEach(function(h){ have[h.code]=h; });
    var out=[];
    sel.forEach(function(i){ var r=parsed.rows[i]; if(r&&have[r.code]) out.push(have[r.code]); });
    return out;
  }

  function recalcAmt(){
    var fin=finalHoldings(), cs=0;
    fin.forEach(function(h){ cs+=toNum(h.cost)*toNum(h.shares); });
    var cash=toNum(S.account.cash), other=toNum(S.account.other);
    var should=cs+cash+other, already=0;
    (S.account.flows||[]).forEach(function(f){ already+=(f.type==="out"?-1:1)*toNum(f.amount); });
    var need=should-already;
    /* 口径二「从今天重新开始」：期初投入 = 今天这个账户的全部家当（按现价算）。
       这样实证第 1 天的收益率是 0，之后的涨跌才是「实证期间」的真实收益。 */
    var nowMV=0;
    fin.forEach(function(h){
      var q=QUOTE[h.code], px=(q&&toNum(q.price)>0)?toNum(q.price):toNum(h.cost);
      nowMV+=px*toNum(h.shares);
    });
    var today0=nowMV+cash+other;
    var hasQ=false;
    fin.forEach(function(h){ var q=QUOTE[h.code]; if(q&&toNum(q.price)>0) hasQ=true; });

    var amt=$("#_impAmt"); if(amt) amt.value=Math.round(Math.max(need,0)*100)/100;
    var note=$("#_impAmtNote");
    if(note) note.innerHTML=
      '导入后持仓成本合计 <b class="num">'+money(cs)+'</b> ＋ 现金 '+money(cash)+
      ' ＋ 其他资产 '+money(other)+' ＝ 应有投入本金 <b class="num">'+money(should)+'</b><br>'+
      (already>0?'已记录的净投入 <b class="num">'+money(already)+'</b> → 本次只需补记 <b class="num">'+
        money(Math.max(need,0))+'</b><br>':'')+
      '<span style="color:#B4791F">两种口径选一个（点上面按钮）：</span><br>'+
      '① <b>历史成本</b> '+money(Math.max(need,0))+' —— 收益率会显示成 '+

    var dl=[];

      var h=have[r.code];

      ? '<div style="background:#FFF8E6;border:1px solid #F0DDB0;border-radius:8px;padding:8px 10px;'+

        '<b>检测到 '+dl.length+' 支已经在账户里：</b>'+dl.join('、')+
        '<br>默认按「覆盖」处理 —— 已有的股数<b>会被替换</b>成导入的数字，不会翻倍。</div>'

    if(all) all.onclick=function(){ $$("#_impPrev .impck").forEach(function(el){ el.checked=all.checked; }); recalcAmt(); };

  $("#_impOk").onclick=function(){
    var sel=selected();
    if(!sel.length){ toast("请至少勾选一条"); return; }
    var date=normDate($("#_impDate").value)||todayStr(), n=0, mode=impMode(), nUpd=0, nNew=0;
    sel.forEach(function(i){
      var r=parsed.rows[i]; if(!r) return;
      var ex=S.holdings.filter(function(v){return v.code===r.code;})[0];
      if(ex){
        /* 覆盖 = 以券商导出为准（默认）。⚠️ 绝不能把股数相加：账户里已有的持仓
           和导入的本来就是同一笔，相加会让持仓和本金同时翻倍。 */
        if(mode==="add"){ ex.shares=toNum(ex.shares)+r.shares; if(r.cost!=null&&toNum(ex.cost)<=0) ex.cost=r.cost; }
        else { ex.shares=r.shares; if(r.cost!=null) ex.cost=r.cost; }
        if(r.name&&r.name!==r.code) ex.name=r.name;
        nUpd++;
      }else{
        S.holdings.push({id:uid(),code:r.code,name:r.name,cost:(r.cost==null?0:r.cost),
          shares:r.shares,buyDate:date,targetSell:0,note:"批量导入"});
        nNew++;
      }
      n++;
    });
    if($("#_impFlow")&&$("#_impFlow").checked){
      var amt=toNum($("#_impAmt").value);
      if(amt>0){
        S.account.flows.push({id:uid(),date:date,type:"in",amount:amt,note:"批量导入持仓，补记投入本金"});
        if(!S.account.startDate||date<S.account.startDate) S.account.startDate=date;
      }
    }
    save(); closeModal();
    refreshAllQuotes(function(){ upsertSnap(); render(); });
    toast("已导入 "+n+" 条（新增 "+nNew+" · 覆盖 "+nUpd+"）");

}

function renderHold(){
  var hs=S.holdings;

  var totPnl=totMV-totCst, totPct=totCst>0?totPnl/totCst*100:null;

  var disp = hs;

      var rh=holdingRuleHits(x.code); if(!rh) return false;
      var n=rh.hrs.length, tot=rh.on.length;
      if(HOLD_FILTER===1) return n>=1;

       '<div class="metric"><div class="lb">可用现金</div><div class="vl num">'+money(toNum(S.account.cash))+'</div>'+
         '<div class="ex">总资产 '+moneyShort(totalAsset())+'</div></div>'+
     '</div>'+
     (HS300?'<div class="mut" style="margin-top:10px">沪深300 <span class="num '+cls(HS300.chgPct)+'">'+

       (realizedPnl()>=0?"+":"")+money(realizedPnl()).replace("¥-","-¥")+'</span> · 共 '+S.trades.length+

  }else{
    h+='<div class="grid g3">';

        '</div>'+
        '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'+

/* ===================== 选基 · ETF 数据 ===================== */
function etfData(){ var d=window.__ETF_DATA__; return (d&&Array.isArray(d.etfs))?d:null; }
var ETF_CAT={broad:"宽基",strategy:"策略指数",sector:"行业·主题",overseas:"跨境/QDII",
             commodity:"商品",bond:"债券",money:"货币"};
var ETF_CATSEL="all", ETF_MINSIZE=0, ETF_MINAMT=0, ETF_MAXPREM=999;

/* ⚠️ 核心/卫星判定 —— 千万别把「ETF」和「宽基」划等号。
     宽基(跨行业) + 策略指数(红利/低波…)= 核心；行业/主题 ETF + 个股 = 卫星。
     跨境要再分一层：纳指/标普这类海外宽基 = 核心；恒生科技/中概/中韩半导体 = 卫星(主题)。
     用户可在「股票配置」页手动覆盖（写进 h.role）。 */
var OV_BROAD=["纳指","纳斯达克","标普","道琼斯","日经","德国","法国","MSCI","富时","罗素","全球"];
var OV_THEME=["恒生科技","恒生互联网","恒生医疗","恒生生物","中概","中韩","亚太",
              "半导体","油气","REIT","科技","医药","消费"];
function etfCatOf(code,name){
  var d=etfData();
  if(d){ var e=d.etfs.filter(function(x){return String(x.c)===String(code);})[0];
         if(e&&e.cat) return e.cat; }
  return null;
}
function isBroadOverseas(nm){
  nm=nm||"";
  for(var i=0;i<OV_THEME.length;i++) if(nm.indexOf(OV_THEME[i])>=0) return false;
  for(var j=0;j<OV_BROAD.length;j++) if(nm.indexOf(OV_BROAD[j])>=0) return true;
  return false;
}
function holdingRole(h){
  if(!h) return "sat";
  if(h.role==="core") return "core";
  if(h.role==="sat")  return "sat";
  var cat=etfCatOf(h.code,h.name);
  if(cat==="broad"||cat==="strategy") return "core";
  if(cat==="overseas") return isBroadOverseas(h.name)?"core":"sat";
  return "sat";
}

/* ---- 单只股票体检 ---- */
var OPSYM={gte:"≥",lte:"≤",gt:">",lt:"<"};
function opText(r){ return (OPSYM[r.op]||r.op)+" "+r.val; }
function ruleValTxt(r,v){
  if(v==null||!isFinite(v)) return "—";
  return fmt(v, Math.abs(v)<3?2:1);
}
function stockCheck(code){
  var d=stockData(); if(!d) return null;
  var st=d.stocks.filter(function(s){return String(s.c)===String(code);})[0];
  if(!st) return null;
  var on=S.rules.filter(function(r){return r.on;});
  var rows=on.map(function(r){ var v=ruleValue(st,r); return {r:r,val:v,pass:passRule(st,r)}; });
  var hit=rows.filter(function(x){return x.pass;}).length;
  return {st:st,rows:rows,hit:hit,total:on.length};
}

              (st.pe>peMed*1.2?"估值高于全市场中位数":"估值接近全市场中位数")):"";
  var t=marketTemp(), deg=t?t.deg:null;

  }else if(ratio>=0.5){

  }else{

  return h;

function premColor(p){
  if(p==null) return "inherit";
  var a=Math.abs(p);
  return a<=1.5?"#12A05C":(a<=3?"inherit":(a<=8?"#BA7517":"#E24B4A"));
}
function premAdvice(p){
  if(p==null) return "—";
  if(p<=3)  return "可分批买入";
  if(p<=8)  return "谨慎，减量或等回落";
  if(p<=10) return "观望";
  return "坚决回避";
}

/* ===================== 页4 · 选股 ===================== */
var SCREEN_MIN=0;   /* 0 = 自动挑一个「至少 5 只入选」的最高门槛 */
function stockData(){
  var d=window.__STOCKS_DATA__;
  return (d&&Array.isArray(d.stocks))?d:null;
}
function ruleValue(st,r){
  var v;
  if(r.key==="peg"){ v=(st.pe>0&&st.ni>0)? (st.pe/st.ni) : null; }
  else v=st[r.key];
  if(v==null||!isFinite(v)) return null;
  return v;
}
function passRule(st,r){
  var v=ruleValue(st,r);
  if(v==null) return false;
  if(r.op==="gte") return v>=r.val;
  if(r.op==="lte") return v<=r.val;
  if(r.op==="gt")  return v>r.val;
  if(r.op==="lt")  return v<r.val;
  return false;
}
/* 把「某只持仓股票」对照已开启的选股规则，返回命中情况。
   用于持仓页给每只股票贴上「达到了哪些指标」的标签，方便按指标筛选。
   注意：选股池用 s.c 存代码（不是 s.code），匹配时按 code 对齐。 */
var HOLD_FILTER = 0;   /* 0=全部 1=命中≥1 3=命中≥3 9=全命中 */
function holdingRuleHits(code){
  var d=stockData(); if(!d) return null;
  var st=d.stocks.filter(function(s){return String(s.c)===String(code);})[0];
  if(!st) return null;
  var on=S.rules.filter(function(r){return r.on;});
  var hrs=on.filter(function(r){return passRule(st,r);}).map(function(r){return r.id;});
  return {st:st,on:on,hrs:hrs};
}
function screenStocks(){
  var d=stockData(); if(!d) return null;
  var on=S.rules.filter(function(r){return r.on;});
  var res=d.stocks.map(function(st){
    var hit=0,hrs=[];
    on.forEach(function(r){ if(passRule(st,r)){ hit++; hrs.push(r.id); } });
    return {st:st,hit:hit,total:on.length,hrs:hrs};
  }).filter(function(x){return x.hit>0;});
  res.sort(function(a,b){ return b.hit-a.hit || (b.st.roe||0)-(a.st.roe||0); });
  on.forEach(function(r){
    r.pass=d.stocks.filter(function(st){return passRule(st,r);}).length;
  });
  return res;
}
function renderScreen(){
  var d=stockData();
  var h='';
  if(!d){
    h+='<div class="card"><div class="empty"><div class="ic">—</div>还没有选股数据<br>'+
      '<span class="mut">双击同目录下的「刷新选股数据.bat」，抓一次全市场数据后回来即可<br>'+
      '（财报一个季度才变一次，不用天天刷）</span></div></div>';
    $("#view").innerHTML=h; $("#pgActs").innerHTML=""; return;
  }
  var res=screenStocks()||[];
  var full=res.filter(function(x){return x.hit===x.total&&x.total>0;});

     '<div style="margin-top:10px">'+MOODS.filter(function(m){return moodCount[m];}).map(function(m){
       return '<span class="tag '+(mf===m?"b":"")+'" data-mood="'+esc(m)+'" style="cursor:pointer">'+esc(m)+' '+moodCount[m]+'</span>';
     }).join("")+'</div></div>';

          return '<span class="tag">'+esc(t)+'</span>';}).join("")+'</div>':'')+
        '</div>';

/* ===================== 页6 · 市场温度 ===================== */
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function marketTemp(){
  var d=window.__STOCKS_DATA__;
  var mk=d&&d.market; if(!mk) return null;
  var c=S.tempCfg;
  var pe=toNum(mk.pe_median), br=toNum(mk.broken_ratio), by=toNum(c.bondYield);
  var ey=pe>0?100/pe:0;                       // 全市场盈利收益率 %
  var gap=ey-by;                               // 股债性价比
  var sPe=pe>0? clamp((pe-toNum(c.peLow))/(toNum(c.peHigh)-toNum(c.peLow))*100,0,100) : null;
  var sBr=clamp((toNum(c.brHigh)-br)/(toNum(c.brHigh)-toNum(c.brLow))*100,0,100);
  var gC=toNum(c.gapCold,4), gH=toNum(c.gapHot,-1);
  var sEy=clamp((gC-gap)/(gC-gH)*100,0,100);
  var parts=[sPe,sBr,sEy].filter(function(x){return x!=null;});
  var deg=parts.length?parts.reduce(function(a,b){return a+b;},0)/parts.length:null;
  return {pe:pe,br:br,ey:ey,gap:gap,sPe:sPe,sBr:sBr,sEy:sEy,deg:deg,mk:mk};
}

        '<td class="r num">'+fmt(d.perShare,4)+'</td><td class="r num">'+fmtInt(d.shares)+'</td>'+
        '<td class="r num b" style="color:var(--down)">'+money(d.amount)+'</td>'+
        '<td class="mut">'+esc(d.year||"")+'</td>'+
        '<td class="c"><button class="btn gy sm" data-deld="'+d.id+'">删</button></td></tr>';
    });

      return '<option value="'+esc(x.code)+'" data-n="'+esc(x.name)+'" data-s="'+toNum(x.shares)+'">'+esc(x.name)+' '+esc(x.code)+'</option>';

  ["#addDiv","#addDiv2"].forEach(function(s){ var b=$(s); if(b) b.onclick=openAdd; });

      var id=el.getAttribute("data-deld");
      S.dividends=S.dividends.filter(function(d){return d.id!==id;}); save(); render();
    };
  });
}

/* ===================== 云同步（JSONBin） =====================
   设计原则（重要）：
   1. 本机数据只在**用户点了确认**之后才会被云端覆盖，绝不静默替换；
   2. 谁新谁赢靠 record 自带的 settings.syncedAt 判断，不依赖无法保证的云端元数据；
   3. 上传遇错只提示，不影响本地继续使用。 */
var SYNC={remoteNewer:false,remoteAt:null,busy:false};
var _cloudTimer=null;
function cloudCfg(){
  var st=(S&&S.settings)||{};
  return {k:(st.cloudKey||"").trim(), b:(st.cloudBin||"").trim()};
}
function paired(){ var c=cloudCfg(); return !!(c.k&&c.b); }
function autoSyncOn(){ return paired() && S.settings.autoSync!==false; }
/* JSONBin 的 Key / Bin ID 都是 ASCII（$2a$10$… 和 24 位十六进制），直接 btoa 足够，
   不需要 escape/unescape 那套已废弃的写法。 */
function b64enc(s){ try{ return btoa(s); }catch(e){ return ""; } }
function b64dec(s){ try{ return atob(s); }catch(e){ return ""; } }
function fmtSyncTime(iso){
  if(!iso) return "未知时间";
  var d=new Date(iso);
  if(!isFinite(d.getTime())) return String(iso);
  return d.toLocaleString("zh-CN",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function scheduleCloudPush(){
  if(!autoSyncOn()) return;
  clearTimeout(_cloudTimer);
  _cloudTimer=setTimeout(function(){ cloudPush({silent:true}); }, 12000);
}
function cloudPush(opt){
  opt=opt||{};
  var c=cloudCfg();
  if(!c.k){ if(!opt.silent) toast("请先填 API Key"); return Promise.resolve(false); }
  if(SYNC.busy) return Promise.resolve(false);
  SYNC.busy=true;
  var url="https://api.jsonbin.io/v3/b"+(c.b?"/"+c.b:"");
  return fetch(url,{method:c.b?"PUT":"POST",
      headers:{"Content-Type":"application/json","X-Master-Key":c.k},
      body:JSON.stringify(S)})
    .then(function(r){
      return r.text().then(function(t){
        var j=null; try{ j=t?JSON.parse(t):{}; }catch(e){ j={}; }
        return {ok:r.ok,st:r.status,j:j||{}};
      });
    })
    .then(function(res){
      SYNC.busy=false;
      var j=res.j;
      if(!res.ok){
        if(!opt.silent) toast("上传失败："+((j&&j.message)||("HTTP "+res.st)));
        return false;
      }
      if(j&&j.metadata&&j.metadata.id) S.settings.cloudBin=j.metadata.id;
      S.settings.syncedAt=new Date().toISOString();
      S.settings.lastSync=new Date().toLocaleString("zh-CN",{hour12:false});
      persist({noCloud:true});
      renderSyncBar();
      if(opt.onDone) opt.onDone(true,null);
      if(!opt.silent) toast("已上传到云端");
      return true;
    })
    .catch(function(e){
      SYNC.busy=false;
      if(!opt.silent) toast("上传失败："+e.message);
      if(opt.onDone) opt.onDone(false,e.message);
      return false;
    });
}
function cloudPull(){
  var c=cloudCfg();
  if(!c.k||!c.b) return Promise.resolve(false);
  SYNC.busy=true;
  return fetch("https://api.jsonbin.io/v3/b/"+c.b+"/latest",
      {headers:{"X-Master-Key":c.k},cache:"no-store"})
    .then(function(r){ return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):{}; }catch(e){ j={}; } return {ok:r.ok,j:j||{}}; }); })
    .then(function(res){
      SYNC.busy=false;
      var rec=res.j&&res.j.record;
      if(!rec){ toast("云端没有数据"); return false; }
      S=rec; normalizeState();
      S.settings.cloudKey=c.k; S.settings.cloudBin=c.b;
      S.settings.lastSync=new Date().toLocaleString("zh-CN",{hour12:false});
      SYNC.remoteNewer=false;
      persist({noCloud:true}); closeModal(); render(); renderSyncBar();
      toast("已从云端同步");
      return true;
    })
    .catch(function(e){ SYNC.busy=false; toast("同步失败："+e.message); return false; });
}
/* 启动时查一次云端是不是比本机新，是的话只挂提示条，绝不动本地数据 */
function cloudProbe(){
  var c=cloudCfg();
  if(!c.k||!c.b||!autoSyncOn()) return;
  fetch("https://api.jsonbin.io/v3/b/"+c.b+"/latest",
      {headers:{"X-Master-Key":c.k},cache:"no-store"})
    .then(function(r){ return r.text().then(function(t){
      var j=null; try{ j=t?JSON.parse(t):{}; }catch(e){ j={}; } return j||{}; }); })
    .then(function(j){
      var rec=j.record;
      if(!rec||!rec.settings) return;
      var rt=rec.settings.syncedAt, lt=S.settings.syncedAt;
      if(rt && (!lt || Date.parse(rt)>Date.parse(lt)+3000)){
        SYNC.remoteNewer=true; SYNC.remoteAt=rt; renderSyncBar();
      }
    }).catch(function(){});
}
function renderSyncBar(){
  var el=$("#syncBar"); if(!el) return;
  if(!paired()||!SYNC.remoteNewer){ el.className="syncbar hide"; el.innerHTML=""; return; }
  el.className="syncbar warn";
  el.innerHTML='<span>云端有更新的数据（'+esc(fmtSyncTime(SYNC.remoteAt))+
    '），要用它替换本机吗？</span><span class="sp"></span>'+
    '<button class="b1" id="_sbPull">同步到本机</button>'+
    '<button class="b2" id="_sbIg">忽略</button>';
  $("#_sbPull").onclick=function(){
    confirmBox("从云端同步？","会用云端那份数据<b>覆盖</b>本机全部内容，不可撤销。<br>本机上次同步："+
      esc(fmtSyncTime(S.settings.syncedAt))+"<br>云端时间："+esc(fmtSyncTime(SYNC.remoteAt))+
      "<br><br>不确定的话，先去设置里导出备份。",function(){ cloudPull(); });
  };
  $("#_sbIg").onclick=function(){ SYNC.remoteNewer=false; renderSyncBar(); };
}
/* 配对链接：把 Key + Bin 塞进 URL 的 # 里，另一端打开即配置好。
   用 hash 是因为 hash 不会发给服务器，Key 不会出现在任何访问日志里。 */
function pairLinkUrl(){
  var c=cloudCfg();
  if(!c.k){ return null; }
  var base;
  try{ base=location.origin+location.pathname; }catch(e){ base=""; }
  if(!base||base==="null"||base.indexOf("http")!==0){
    base="https://yysheng2026.github.io/invest-workbench/index.html";
  }
  return base+"#sync="+encodeURIComponent(b64enc(JSON.stringify({k:c.k,b:c.b})));
}
/* 从 URL 的 #sync= 里解出 Key / Bin。
   ⚠️ 这里【故意不清掉地址栏的 hash】——
   iPhone 的「分享 → 添加到主屏幕」是把当时的 URL 原样存成快捷方式，
   而主屏幕 App 用的是独立存储（和 Safari 不共享 localStorage），
   只有把这段口令留在 URL 里，主屏 App 第一次打开才会重新自动配对。
   想去掉的话去设置里点「清掉地址栏里的配对口令」。 */
function hasPairHash(){
  try{ return /[#&]sync=[^&]+/.test(location.hash||""); }catch(e){ return false; }
}
function clearPairHash(){
  try{ history.replaceState(null,"",location.pathname+(location.search||"")); }
  catch(e){ try{ location.hash=""; }catch(e2){} }
}
/* 本机是不是一台「全新的空设备」——是的话从云端拉数据不需要二次确认
   （本地本来就没东西可覆盖，确认弹窗纯属多余）。 */
function localIsEmpty(){
  return !(S.holdings&&S.holdings.length) &&
         !(S.trades&&S.trades.length) &&
         !(S.logs&&S.logs.length);
}
/* 把「整条配对链接」或「#sync= 后面那段码」写进本机配置。
   这是主屏幕 App / 换了新浏览器之后重新配对的兜底入口。 */
function applyPairCode(txt){
  txt=String(txt||"").trim();
  if(!txt) return false;
  var m=txt.match(/[#&]sync=([^&\s]+)/);
  var code=m?m[1]:txt;
  var cfg=null;
  try{ cfg=JSON.parse(b64dec(decodeURIComponent(code))); }catch(e){ cfg=null; }
  if(!cfg||!cfg.k) return false;
  S.settings.cloudKey=cfg.k;
  if(cfg.b) S.settings.cloudBin=cfg.b;
  S.settings.autoSync=true;
  persist({noCloud:true});
  return true;
}
function parsePairHash(){
  if(!hasPairHash()) return false;
  var m=(location.hash||"").match(/[#&]sync=([^&]+)/);
  var cfg=null;
  try{ cfg=JSON.parse(b64dec(decodeURIComponent(m[1]))); }catch(e){ cfg=null; }
  if(!cfg||!cfg.k){ toast("配对链接无效"); return false; }
  S.settings.cloudKey=cfg.k;
  if(cfg.b) S.settings.cloudBin=cfg.b;
  S.settings.autoSync=true;
  persist({noCloud:true});
  return true;
}

    var dt=dateAdd(todayStr(),-i);
    var t=(400-i)/400;
    var investedNow=200000 + (i<=240?60000:0) + (i<=90?40000:0);
    var v=investedNow*(1+0.06*t+Math.sin(i/23)*0.012+Math.cos(i/41)*0.008);
    snaps.push({date:dt,total:Math.round(v)});
  }
  s.account.snaps=snaps;
  return s;
}

/* ---------------- 路由 ---------------- */
function renderNav(){
  $("#nav").innerHTML=VIEWS.map(function(v){
    return '<button data-v="'+v.id+'" class="'+(v.id===CUR?"on":"")+'"><span class="dot"></span>'+v.name+'</button>';
  }).join("");
  $("#tabs").innerHTML=VIEWS.map(function(v){
    return '<button data-v="'+v.id+'" class="'+(v.id===CUR?"on":"")+'">'+v.name+'</button>';
  }).join("");
  $$("[data-v]").forEach(function(b){ b.onclick=function(){ go(b.getAttribute("data-v")); }; });
  var v=VIEWS.filter(function(x){return x.id===CUR;})[0]||VIEWS[0];
  $("#pgTitle").textContent=v.name;
}
function go(id){
  if(!VIEWS.some(function(v){return v.id===id;})) id="plan";
  CUR=id; renderNav(); render(); window.scrollTo(0,0);
}
function render(){
  var map={plan:renderPlan,account:renderAccount,hold:renderHold,screen:renderScreen,
    log:renderLog,temp:renderTemp,dividend:renderDividend,config:renderConfig,fund:renderFund};
  var v=VIEWS.filter(function(x){return x.id===CUR;})[0];
  $("#pgSub").textContent=v?v.sub:"";
  (map[CUR]||renderPlan)();
  var sf=$("#sideFoot");
  if(sf){
    var m=metrics();
    sf.innerHTML='实证第 '+m.days+' 天<br>'+
      (m.annual!=null?'年化 '+pct(m.annual)+'<br>':'')+
      (S.settings.lastSync?'已同步 '+esc(S.settings.lastSync):'本地存储');
  }
}
function boot(){
  load();
  var bs=$("#brandSub");
  if(bs&&S.account.startDate){
    var d=Math.max(0,daysBetween(S.account.startDate,todayStr()));
    bs.textContent="实证第 "+(d+1)+" 天 · 未来无人知晓";
  }
  renderNav();
  var setBtn=$("#btnSet"); if(setBtn) setBtn.onclick=openSettings;
  startAuto();
  /* 桌面版：先从 data\save.json 读回来（若文件里比 localStorage 新），再渲染
     并把 localStorage 里的内容写进文件（文件缺失时做首次落盘）。
     探测失败（file:// 或线上）会立刻回调，不影响网页版启动。
     ⚠️ 云同步必须排在 loadFromDesktop 之后，否则桌面版的文件会盖掉刚拉下来的云端数据。 */
  loadFromDesktop(function(){
    if(DESKTOP.ok) ensureDesktopFile();
    afterLoad();
    refreshAllQuotes(function(){ upsertSnap(); render(); });
    render();
  });
}
function afterLoad(){
  normalizeState();
  renderSyncBar();
  /* 从配对链接进来：先把 Key / Bin 写进去，再决定要不要拉数据 */
  if(parsePairHash()){
    if(paired()){
      if(S.settings.cloudBin && localIsEmpty()){
        /* 这台设备本来就是空的，云端数据不可能「覆盖」掉任何东西 → 直接拉 */
        toast("已配对，正在取回云端数据…");
        cloudPull();
      }else{
        toast("已配对成功");
        cloudProbe();
      }
    } else {
      toast("Key 已保存，点「上传到云端」开始同步");
    }
    return;
  }
  cloudProbe();
}
/* 首次跑桌面版时，把浏览器里已有的数据落一份到文件，避免"看起来像被清空" */
function ensureDesktopFile(){
  fetch("/api/load",{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.empty){
      fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(S)}).catch(function(){});
    }
  }).catch(function(){});
}
document.addEventListener("DOMContentLoaded",boot);

/* 注册 Service Worker —— 让手机加到主屏后断网也能打开。
   带版本号的 URL 可绕开浏览器对同一 SW 脚本 24 小时的更新节流。 */
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js?v=11").then(function(reg){
      reg.update&&reg.update();
    }).catch(function(){});
  });
}
/* 新 SW 接管后自动刷新一次，避免停在旧版本 */
if("serviceWorker" in navigator){
  var _rf=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(_rf) return; _rf=true; location.reload();
  });
}

window.__WB__={get S(){return S;},render:render,go:go,xirr:xirr,twr:twr,metrics:metrics,
